services:
  - type: web
    name: text-to-sql-api
    runtime: python
    plan: free
    # data/olist.db and chroma_store/ are pre-built and committed to the repo,
    # so the build only needs to install dependencies — no data/seed.py or
    # agent/build_index.py step required.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./data/olist.db
      - key: CHROMA_STORE_PATH
        value: ./chroma_store
      - key: FRONTEND_URL
        value: https://your-frontend.onrender.com
